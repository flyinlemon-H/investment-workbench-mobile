<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Discussion Workbench Isolated Acceptance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#1b1b1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{width:100%;max-width:390px;min-height:844px;margin:0 auto;padding:12px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{min-width:0;min-height:44px;border:1px solid #c9c2b4;background:#fff8;padding:7px 2px;font-size:12px;font-weight:800}.tab.active{background:#1b1b1b;color:#fff}.card{border:1px solid #c9c2b4;background:#f8f4eb;padding:14px;margin-top:10px}.hero{border-left:4px solid #725786}.status{display:flex;justify-content:space-between;gap:8px;align-items:center}.status b{font-size:20px}.meta,.note{font-size:12px;color:#655f56;line-height:1.55}.data{display:grid;gap:4px;padding:8px;margin-top:10px;background:#fff6}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.actions button,.copy{min-height:44px;width:100%;border:1px solid #1b1b1b;background:#1b1b1b;color:#fff;font-size:15px;font-weight:800}.actions button:nth-child(n+2),.copy.secondary{background:transparent;color:#1b1b1b}.state h2{font-size:18px;margin:10px 0 6px}.state p{font-size:13px;line-height:1.6}.prompt{width:100%;min-height:300px;margin-top:10px;padding:10px;border:1px solid #aaa;background:#fff;font-size:13px;line-height:1.5;resize:vertical}.hidden{display:none}.modal-bg{position:fixed;inset:0;display:none;align-items:center;background:#0007;padding:12px}.modal-bg.show{display:flex}.modal{width:100%;max-height:92vh;overflow:auto;background:#f5f1e8;border:1px solid #1b1b1b;padding:15px}.modal textarea{width:100%;min-height:220px;font-size:14px}.preview{border:1px solid #c9c2b4;padding:10px;margin-top:10px;font-size:13px}.history summary{min-height:44px;padding:12px;font-weight:800;cursor:pointer}.history article{border-top:1px solid #c9c2b4;padding:10px}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #b58932;outline-offset:2px}
  </style>
  <script src="../../src/plan-v2.js"></script>
  <script src="../../src/symbol-identity.js"></script>
  <script src="../../src/discussion-workbench.js"></script>
  <script src="../../src/discussion-state-contract.js"></script>
  <script src="../../src/clipboard.js"></script>
</head>
<body>
<main>
  <div class="tabs" aria-label="标的工作区"><button class="tab active">讨论</button><button class="tab">计划</button><button class="tab">操作记录</button><button class="tab">技术面</button><button class="tab">新闻催化</button><button class="tab">基本面</button><button class="tab">估值/配置</button><button class="tab">长期逻辑</button></div>
  <section id="workbench"></section>
</main>
<div class="modal-bg" id="importModal"><div class="modal"><h2>导入讨论结论</h2><p class="note">保存后将成为下次讨论的起点。日期和技术锚点由程序附加。</p><textarea id="jsonInput" placeholder='{"currentState":{...}}'></textarea><div id="preview"></div><div class="actions"><button id="cancel">取消</button><button id="previewBtn">预览结果</button><button id="saveBtn" disabled>确认保存</button></div></div></div>
<script>
  const W=DiscussionWorkbench,C=DiscussionStateContract;
  const row=(date,close)=>({date,close,adjustment:'qfq',price_basis:'adjusted',provider:'fixture',is_complete_bar:true});
  let stock={id:'fixture',code:'601138.SS',name:'工业富联',type:'holding',role:'核心仓',shares:100,avgCost:42,currentPrice:55,priceUpdatedAt:'2026-08-31',priceSource:'fixture',priceHistory:[row('2026-08-20',48),row('2026-08-21',49),row('2026-08-24',50),row('2026-08-25',51)],technicalData:{technicalDataStatus:'fresh',trendStatus:'recovery',supportLevels:[49],resistanceLevels:[58]},technicalReview:{updatedAt:'2026-08-25T08:00:00Z',shortTermTechnical:{trendStatus:'recovery',cyclePosition:'early_uptrend',technicalSummary:'修复观察',riskFlags:['resistance_overhead'],confidence:'medium'}},plans:[],longTermLogic:{updatedAt:'2026-08-20T08:00:00Z',logicStatus:'valid',investmentThesis:'长期逻辑仍有效'}};
  let prepared=null,result=null;
  function archiveResult(p,summary='修复延续，继续观察。'){return JSON.stringify({currentState:{symbol:'601138.SS',sourceDiscussionVersion:p.sourceDiscussionVersion,stage:'修复观察',summary,keyChanges:['新增完整日K已纳入讨论'],risks:['上方压力仍需确认'],watchPoints:['观察量价配合'],planRelation:'没有当前计划，不自动创建或修改计划。',confidence:'medium'}},null,2)}
  function establishPrior(){const p=W.buildDiscussionRequest(stock),r=C.process(archiveResult(p,'首次结论：修复观察。'),{expectedSymbol:'601138.SS',sourceDiscussionVersion:p.sourceDiscussionVersion}),built=C.buildCandidate({stocks:[stock]},r,{prepared:p,now:'2026-08-25T09:00:00Z',timeZone:'Asia/Shanghai'});stock=built.candidate.stocks[0];stock.priceHistory=stock.priceHistory.concat([row('2026-08-26',52),row('2026-08-27',53),row('2026-08-28',54),row('2026-08-31',55)]);stock.technicalData={...stock.technicalData,technicalAsOf:'2026-08-31',latestCompleteBar:'2026-08-31'};stock.currentPrice=55}
  function stateHtml(item,label){return `<article class="card state"><div class="status"><span>${label}</span><span class="meta">${item.confirmedDate} · 锚点 ${item.technicalAsOf}</span></div><h2>${item.stage}</h2><p>${item.summary}</p><div class="note">风险：${item.risks.join('；')||'无'}<br>观察：${item.watchPoints.join('；')||'无'}<br>计划关系：${item.planRelation}</div></article>`}
  function render(){const store=W.normalizeStore(stock.discussionState),ctx=W.buildContext(stock),count=ctx.context.currentFacts.technical.bars.length,current=store.current;document.getElementById('workbench').innerHTML=`<article class="card hero"><div class="status"><div><div class="note">单股连续讨论</div><b>${current?'Current':'尚无已确认讨论结论'}</b></div><span class="note">${current?current.confirmedDate:'等待首次确认'}</span></div><div class="data meta"><span>技术数据截至 ${ctx.context.currentFacts.technical.technicalAsOf}</span><span>${current?(count?`新增完整日K ${count} 根`:'自上次确认后暂无新的完整日K'):'首次讨论将建立后续连续分析的起点'}</span><span>当前目标仓位尚未确认</span></div><div class="actions"><button id="start">开始讨论</button><button id="archive">整理结论</button><button id="import">导入结论</button><button id="historyBtn">查看历史</button></div><p class="note">本页面不调用 AI，不保存截图、聊天全文或 Prompt。</p></article>${current?stateHtml(current,'Current State'):''}<article id="prepared" class="card hidden"><div id="preparedTitle"><b>讨论上下文已准备</b></div><div id="metrics" class="note"></div><textarea id="request" class="prompt" readonly></textarea><button id="copy" class="copy">复制给AI</button></article><details id="history" class="card history"><summary>查看历史（${store.history.length}）</summary>${store.history.slice().reverse().map(item=>stateHtml(item,'已被替代')).join('')||'<p class="note">暂无历史。</p>'}</details>`;bind()}
  function showPrepared(payload,title){document.getElementById('prepared').classList.remove('hidden');document.getElementById('preparedTitle').innerHTML=`<b>${title}</b>`;document.getElementById('request').value=payload.request;document.getElementById('metrics').textContent=`字符 ${payload.metrics.characters} · 约 ${payload.metrics.approxTokens} tokens`;document.getElementById('copy').onclick=()=>ClipboardUtils.copyTextWithFallback(payload.request,{sourceElement:document.getElementById('request')})}
  function bind(){document.getElementById('start').onclick=()=>{prepared=W.buildDiscussionRequest(stock);showPrepared(prepared,'讨论上下文已准备')};document.getElementById('archive').onclick=()=>{if(!prepared){document.getElementById('start').click();return}prepared.archive=W.buildArchiveRequest(prepared);showPrepared(prepared.archive,'归档结论 Prompt 已准备')};document.getElementById('import').onclick=()=>{if(!prepared)return document.getElementById('start').click();if(!prepared.archive)prepared.archive=W.buildArchiveRequest(prepared);document.getElementById('jsonInput').value=archiveResult(prepared,'第二次结论：四根新增日K后的修复观察。');document.getElementById('preview').innerHTML='';document.getElementById('saveBtn').disabled=true;document.getElementById('importModal').classList.add('show')};document.getElementById('historyBtn').onclick=()=>document.getElementById('history').open=true}
  document.getElementById('cancel').onclick=()=>document.getElementById('importModal').classList.remove('show');document.getElementById('previewBtn').onclick=()=>{result=C.process(document.getElementById('jsonInput').value,{expectedSymbol:'601138.SS',sourceDiscussionVersion:prepared.sourceDiscussionVersion});document.getElementById('preview').innerHTML=C.renderPreview(result,{technicalAsOf:prepared.technicalSnapshot.anchorBar.date,confirmedDate:'2026-08-31'});document.getElementById('saveBtn').disabled=!result.ok};document.getElementById('saveBtn').onclick=async()=>{const outcome=await C.commit(result,{stocks:[stock]},{saveCandidate:async candidate=>candidate},{prepared,now:'2026-08-31T10:00:00Z',timeZone:'Asia/Shanghai'});if(outcome.status==='completed'){stock=outcome.state.stocks[0];prepared=null;document.getElementById('importModal').classList.remove('show');render()}};
  establishPrior();render();
</script>
</body>
</html>
