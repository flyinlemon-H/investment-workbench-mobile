<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Discussion Workbench Isolated Acceptance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#1b1b1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}body.prompt-open{overflow:hidden}main{width:100%;max-width:390px;min-height:844px;margin:0 auto;padding:12px;overflow-x:hidden}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{min-width:0;min-height:44px;border:1px solid #c9c2b4;background:#fff8;padding:7px 2px;font-size:12px;font-weight:800}.tab.active{background:#1b1b1b;color:#fff}.card{max-width:100%;overflow-wrap:anywhere;border:1px solid #c9c2b4;background:#f8f4eb;padding:14px;margin-top:10px}.hero{border-left:4px solid #725786}.status{display:flex;justify-content:space-between;gap:8px;align-items:center}.status b{font-size:20px}.meta,.note{font-size:12px;color:#655f56;line-height:1.55}.data{display:grid;gap:4px;padding:8px;margin-top:10px;background:#fff6}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.actions button,.copy{min-height:44px;width:100%;border:1px solid #1b1b1b;background:#1b1b1b;color:#fff;font-size:15px;font-weight:800}.actions button:nth-child(n+2),.copy.secondary{background:transparent;color:#1b1b1b}.state{border-left:4px solid #2f5d6e}.state h2{font-size:20px;margin:6px 0}.state h3{font-size:16px;line-height:1.4;margin:8px 0}.state p{font-size:13px;line-height:1.6}.badges{display:flex;gap:7px}.badges span{border-radius:999px;padding:5px 9px;background:#1b1b1b;color:#fff;font-size:12px;font-weight:800}.badges span+span{background:transparent;color:#1b1b1b;border:1px solid #c9c2b4}.compact{display:grid;gap:4px;font-size:12.5px;line-height:1.45}.focus{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.45}.modal-bg{position:fixed;inset:0;display:none;align-items:center;background:#0007;padding:12px;overscroll-behavior:contain}.modal-bg.show{display:flex}.modal{width:100%;max-height:calc(100dvh - 24px);overflow:auto;background:#f5f1e8;border:1px solid #1b1b1b;padding:15px}.prompt-modal{overflow:hidden;display:flex;flex-direction:column}.prompt-modal h2{margin:0 0 6px}.prompt-summary{display:grid;gap:6px;border:1px solid #c9c2b4;background:#fff6;padding:10px;font-size:13px;line-height:1.5}.feedback{min-height:24px;margin-top:8px;color:#2f5d6e;font-size:13px;font-weight:800}.prompt-details{margin-top:12px;border:1px solid #c9c2b4;overflow:hidden}.prompt-details summary{display:flex;align-items:center;min-height:44px;padding:10px;font-weight:800;cursor:pointer}.prompt-details textarea{width:100%;height:32vh;max-height:260px;min-height:150px;padding:10px;border:0;border-top:1px solid #c9c2b4;background:#fff;font-size:14px;line-height:1.5;resize:none;overflow:auto}.modal textarea#importText,.modal textarea#jsonInput{width:100%;min-height:220px;font-size:14px}.preview{border:1px solid #c9c2b4;padding:10px;margin-top:10px;font-size:13px}.history summary{min-height:44px;padding:12px;font-weight:800;cursor:pointer}.history article{border-top:1px solid #c9c2b4;padding:10px}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #b58932;outline-offset:2px}
  </style>
  <script src="../../src/plan-v2.js"></script>
  <script src="../../src/symbol-identity.js"></script>
  <script src="../../src/discussion-workbench.js"></script>
  <script src="../../src/strict-ai-json.js"></script>
  <script src="../../src/discussion-state-contract.js"></script>
  <script src="../../src/clipboard.js"></script>
</head>
<body>
<main>
  <div class="tabs" aria-label="标的工作区"><button class="tab active">讨论</button><button class="tab">计划</button><button class="tab">操作记录</button><button class="tab">技术面</button><button class="tab">新闻催化</button><button class="tab">基本面</button><button class="tab">估值/配置</button><button class="tab">长期逻辑</button></div>
  <section id="workbench"></section>
</main>
<div class="modal-bg" id="promptModal" role="dialog" aria-modal="true" aria-labelledby="promptTitle"><div class="modal prompt-modal"><h2 id="promptTitle"></h2><p id="promptIntro" class="note"></p><div id="promptSummary" class="prompt-summary"></div><div id="copyFeedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="closePrompt">关闭</button><button id="copyPrompt">复制给AI</button></div><details id="promptDetails" class="prompt-details"><summary>查看完整 Prompt</summary><textarea id="promptText" readonly aria-label="完整 Prompt"></textarea></details></div></div>
<div class="modal-bg" id="importModal"><div class="modal"><h2>导入讨论结论</h2><p class="note">保存后将成为下次讨论的起点。日期和技术锚点由程序附加。</p><textarea id="jsonInput" placeholder='{"currentState":{...}}'></textarea><div id="preview"></div><div class="actions"><button id="cancel">取消</button><button id="previewBtn">预览结果</button><button id="saveBtn" disabled>确认保存</button></div></div></div>
<script>
  const W=DiscussionWorkbench,C=DiscussionStateContract;
  const row=(date,close)=>({date,close,adjustment:'qfq',price_basis:'adjusted',provider:'fixture',is_complete_bar:true});
  let stock={id:'fixture',code:'601138.SS',name:'工业富联',type:'holding',role:'核心仓',shares:100,avgCost:42,currentPrice:55,priceUpdatedAt:'2026-08-31',priceSource:'fixture',priceHistory:[row('2026-08-20',48),row('2026-08-21',49),row('2026-08-24',50),row('2026-08-25',51)],technicalData:{technicalDataStatus:'fresh',trendStatus:'recovery',supportLevels:[49],resistanceLevels:[58]},technicalReview:{updatedAt:'2026-08-25T08:00:00Z',shortTermTechnical:{trendStatus:'recovery',cyclePosition:'early_uptrend',technicalSummary:'修复观察',riskFlags:['resistance_overhead'],confidence:'medium'}},plans:[],longTermLogic:{updatedAt:'2026-08-20T08:00:00Z',logicStatus:'valid',investmentThesis:'长期逻辑仍有效'}};
  let prepared=null,result=null;
  function archiveResult(p,summary='修复延续，继续观察。'){return JSON.stringify({currentState:{symbol:'601138.SS',sourceDiscussionVersion:p.sourceDiscussionVersion,actionAssessment:{category:'hold_watch',priority:'low',headline:'当前没有临近的仓位决策窗口，维持常规观察。',reasons:['修复延续但尚无仓位调整确认信号。'],upgradeConditions:['关键结构确认后提高复核优先级。'],downgradeConditions:['修复结构破坏后降低当前判断。']},attentionLevel:'normal',trendAssessment:{overall:'recovery',timeframes:[{timeframe:'日线',status:'recovery',explanation:'修复延续，仍需量价确认。'}]},structureAssessment:[{timeframe:'60分钟',type:'recovery',status:'forming',source:'ai_chart_judgment',sourceAsOf:'',shortReason:'修复结构形成中，尚未确认。'}],stage:'修复观察',focusPoints:['观察量价能否确认修复延续。','上方压力能否有效突破。'],summary,keyChanges:['新增完整日K已纳入讨论'],risks:['上方压力仍需确认'],watchPoints:['观察更大周期趋势能否同步。'],planRelation:{status:'no_matching_plan',summary:'没有当前计划，不自动创建或修改计划。'},confidence:'medium'}},null,2)}
  function contractOptions(p){return {expectedSymbol:'601138.SS',sourceDiscussionVersion:p.sourceDiscussionVersion,holdingShares:stock.shares,hasActivePlan:false,technicalDataStatus:'fresh',programProvesFullPlanConditions:false}}
  function establishPrior(addBars=true){const p=W.buildDiscussionRequest(stock),r=C.process(archiveResult(p,'首次结论：修复观察。'),contractOptions(p)),built=C.buildCandidate({stocks:[stock]},r,{prepared:p,now:'2026-08-25T09:00:00Z',timeZone:'Asia/Shanghai'});stock=built.candidate.stocks[0];if(addBars)stock.priceHistory=stock.priceHistory.concat([row('2026-08-26',52),row('2026-08-27',53),row('2026-08-28',54),row('2026-08-31',55)]);stock.technicalData={...stock.technicalData,technicalAsOf:addBars?'2026-08-31':'2026-08-25',latestCompleteBar:addBars?'2026-08-31':'2026-08-25'};stock.currentPrice=addBars?55:51}
  function stateHtml(item,label){if(!item.actionAssessment)return `<article class="card state"><div class="status"><span>${label}</span><span class="meta">${item.confirmedDate} · 锚点 ${item.technicalAsOf}</span></div><h2>${item.stage}</h2><p>${item.summary}</p></article>`;return `<article class="card state"><div class="status"><span>${label}</span><span class="meta">${item.confirmedDate} · 锚点 ${item.technicalAsOf}</span></div><div class="badges"><span>普通观察</span><span>低优先级</span></div><div class="note">操作倾向</div><h2>持有观察</h2><h3>${item.actionAssessment.headline}</h3><div class="compact"><b>趋势</b><span>日线：修复</span><b>结构</b><span>60分钟：修复结构形成中</span><b>当前重点</b></div><ul class="focus">${item.focusPoints.map(point=>`<li>${point}</li>`).join('')}</ul><div class="note"><b>与计划关系：</b>${item.planRelation.summary}</div><details><summary>查看完整结论</summary><p>${item.summary}</p></details></article>`}
  function render(){const store=W.normalizeStore(stock.discussionState),ctx=W.buildContext(stock),count=ctx.context.currentFacts.technical.bars.length,current=store.current,hero=`<article class="card hero"><div class="status"><div><div class="note">当前状态</div><b>${current?'当前':'尚无讨论结论'}</b></div><span class="note">${current?current.confirmedDate:'首次使用'}</span></div><div class="data meta"><span>技术数据截至 ${ctx.context.currentFacts.technical.technicalAsOf}</span><span>${current?(count?`新增完整日K ${count} 根`:'自上次确认后暂无新的完整日K'):'首次保存结论后，程序将从这里继续跟踪后续变化。'}</span><span>当前目标仓位尚未确认</span></div><div class="actions"><button id="start">开始讨论</button><button id="archive">整理结论</button><button id="import">导入结论</button><button id="historyBtn">查看历史</button></div><p class="note">本页面不调用 AI，不保存截图、聊天全文或 Prompt。</p></article>`;document.getElementById('workbench').innerHTML=`${current?stateHtml(current,'当前结论'):''}${hero}<details id="history" class="card history"><summary>查看历史（${store.history.length}）</summary>${store.history.slice().reverse().map(item=>stateHtml(item,'历史结论')).join('')||'<p class="note">暂无历史结论。</p>'}</details>`;bind()}
  function ensureArchive(){if(!prepared)prepared=W.buildDiscussionRequest(stock);if(!prepared.archive)prepared.archive=W.buildArchiveRequest(prepared);return prepared}
  function showPrompt(payload,kind){const context=prepared.context,technical=context.currentFacts.technical,count=technical.bars.length,modal=document.getElementById('promptModal'),archive=kind==='archive',included=[];if(context.currentState)included.push('当前结论');if(Number(context.currentFacts.holding.shares)>0)included.push('持仓');if(context.currentFacts.plans.length)included.push('计划状态');document.getElementById('promptTitle').textContent=archive?'整理结论已准备':'讨论上下文已准备';document.getElementById('promptIntro').textContent=archive?'用于把刚才的讨论整理成可导入结论，不会修改计划或持仓。':'当前上下文已经准备好，可以复制给 AI 继续讨论。';document.getElementById('promptSummary').innerHTML=(archive?['用于整理本轮讨论的最终结论','保存前仍需回到程序导入并确认']:[`技术数据截至 ${technical.technicalAsOf}`,context.mode==='continuation'?(count?`新增日K：${count}根`:'自上次确认后暂无新的完整日K'):`首次讨论基线：${count}根完整日K`,`已带入：${included.join('、')||'当前技术事实'}`]).map(line=>`<div>${line}</div>`).join('');document.getElementById('promptText').value=payload.request;document.getElementById('copyFeedback').textContent='';document.getElementById('promptDetails').open=false;modal.dataset.kind=kind;modal.classList.add('show');document.body.classList.add('prompt-open');document.getElementById('copyPrompt').focus()}
  function closePrompt(){document.getElementById('promptModal').classList.remove('show');document.body.classList.remove('prompt-open')}
  async function copyPrompt(){const kind=document.getElementById('promptModal').dataset.kind,payload=kind==='archive'?prepared.archive:prepared,field=document.getElementById('promptText'),details=document.getElementById('promptDetails'),forcedFailure=params.has('copyfail'),result=forcedFailure?{ok:false}:await ClipboardUtils.copyTextWithFallback(payload.request,{selectableElement:field,detailsElement:details,manualCopy:false});document.getElementById('copyFeedback').textContent=result.ok?'已复制，可以前往 AI 继续讨论':'复制失败，请长按复制';if(!result.ok){details.open=true;field.focus();field.select()}}
  function bind(){document.getElementById('start').onclick=()=>{prepared=W.buildDiscussionRequest(stock);showPrompt(prepared,'discussion')};document.getElementById('archive').onclick=()=>{const context=ensureArchive();showPrompt(context.archive,'archive')};document.getElementById('import').onclick=()=>{const context=ensureArchive();document.getElementById('jsonInput').value=archiveResult(context,'第二次结论：四根新增日K后的修复观察。');document.getElementById('preview').innerHTML='';document.getElementById('saveBtn').disabled=true;document.getElementById('importModal').classList.add('show')};document.getElementById('historyBtn').onclick=()=>document.getElementById('history').open=true}
  const params=new URLSearchParams(location.search);document.getElementById('closePrompt').onclick=closePrompt;document.getElementById('copyPrompt').onclick=copyPrompt;document.getElementById('promptModal').onclick=event=>{if(event.target.id==='promptModal')closePrompt()};
  document.getElementById('cancel').onclick=()=>document.getElementById('importModal').classList.remove('show');document.getElementById('previewBtn').onclick=()=>{result=C.process(document.getElementById('jsonInput').value,contractOptions(prepared));document.getElementById('preview').innerHTML=C.renderPreview(result,{technicalAsOf:prepared.technicalSnapshot.anchorBar.date,confirmedDate:'2026-08-31'});document.getElementById('saveBtn').disabled=!result.ok};document.getElementById('saveBtn').onclick=async()=>{const outcome=await C.commit(result,{stocks:[stock]},{saveCandidate:async candidate=>candidate},{prepared,now:'2026-08-31T10:00:00Z',timeZone:'Asia/Shanghai'});if(outcome.status==='completed'){stock=outcome.state.stocks[0];prepared=null;document.getElementById('importModal').classList.remove('show');render()}};
  const firstUse=params.has('first');if(!firstUse){establishPrior(!params.has('zero'));if(params.has('legacy')){const legacy={...stock.discussionState.current,schemaVersion:W.LEGACY_STATE_SCHEMA_VERSION,planRelation:'历史计划关系保持观察。'};for(const key of ['actionAssessment','attentionLevel','trendAssessment','structureAssessment','focusPoints'])delete legacy[key];stock.discussionState.current=legacy}}render();
</script>
</body>
</html>
