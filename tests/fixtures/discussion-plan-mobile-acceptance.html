<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>讨论到计划移动验收</title>
<style>
:root{--ink:#1b1b1b;--ink2:#4d4a43;--ink3:#777168;--paper:#f5f1e8;--line:#d8d0c3;--teal:#16756f;--gold:#9a6c10;--seal:#9c3f35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;overflow-x:hidden}.wrap{width:min(390px,100%);min-height:844px;margin:auto;padding:14px}.card,.modal{border:1px solid var(--line);background:#fffdf8;padding:15px;border-radius:12px}.card{display:grid;gap:11px}.title{font-size:20px;font-weight:900}.note{color:var(--ink2);font-size:13px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:44px;border:1px solid var(--ink);border-radius:9px;background:var(--ink);color:#fff;padding:8px 12px;font-weight:800}.btn.ghost{background:transparent;color:var(--ink)}.modal-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(20,20,20,.58);z-index:10}.modal-bg.show{display:flex}.modal{width:100%;max-height:calc(100dvh - 24px);overflow:auto;overflow-x:hidden}.modal h2{margin:0 0 8px}.summary{display:grid;gap:6px;margin:10px 0;padding:10px;border:1px solid var(--line);font-size:13px}.feedback{min-height:24px;color:var(--teal);font-weight:800;font-size:13px}.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:13px;overflow-wrap:anywhere}.prompt-text{height:28vh;overflow:auto}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.modal-actions.three .btn:last-child{grid-column:1/-1}.preview{display:grid;gap:8px;margin-top:10px;overflow-wrap:anywhere}.preview section{padding:10px;border:1px solid var(--line)}.preview h3,.preview h4{margin:0 0 7px}.discussion-plan-summary{display:grid;gap:6px}.discussion-plan-summary>div{display:grid;gap:2px;line-height:1.5}.alert,.hint{padding:9px;border-left:4px solid var(--seal);background:#f7ece8}.hint{border-left-color:var(--teal)}button:disabled{opacity:.45}.status{margin-top:10px;color:var(--teal);font-weight:800}
</style>
<script src="../../src/plan-v2.js"></script>
<script src="../../src/symbol-identity.js"></script>
<script src="../../src/strict-ai-json.js"></script>
<script src="../../src/discussion-workbench.js"></script>
<script src="../../src/plan-review.js"></script>
<script src="../../src/discussion-plan-workflow.js"></script>
<script src="../../src/clipboard.js"></script>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="title">工业富联 · 独立计划验收</div>
    <div class="note">当前没有 Discussion 或 Current State。此验收页仅使用内存 fixture，不读写用户数据。</div>
    <div class="note"><b>计划工作区</b></div>
    <div class="actions"><button class="btn" id="prepare">整理计划</button><button class="btn ghost" id="import">导入计划</button></div>
    <div class="note"><b>讨论工作区便捷入口</b></div>
    <div class="actions"><button class="btn" id="discussionPrepare">整理计划</button><button class="btn ghost" id="discussionImport">导入计划</button></div>
    <div id="status" class="status">正式计划写入次数：0</div>
  </section>
</main>
<div class="modal-bg" id="promptModal"><div class="modal"><h2>计划整理已准备</h2><div class="note">请继续在当前 AI 对话中使用此 Prompt。AI 将只整理对话中已经形成的计划结论。</div><div class="summary"><div>已带入当前持仓和现有计划</div><div>只整理当前对话中已经明确形成的计划</div><div>导入和确认前不会修改正式计划</div></div><div class="feedback" id="copyFeedback"></div><div class="modal-actions"><button class="btn ghost" id="closePrompt">关闭</button><button class="btn" id="copy">复制给AI</button></div><details><summary>查看完整 Prompt</summary><textarea class="prompt-text" id="promptText" readonly></textarea></details></div></div>
<div class="modal-bg" id="importModal"><div class="modal"><h2>导入计划</h2><div class="note">预览不会写入；只有最后确认才会创建正式计划。</div><textarea id="jsonText"></textarea><div id="message" class="note"></div><div id="preview" class="preview"></div><div class="modal-actions three"><button class="btn ghost" id="closeImport">取消</button><button class="btn ghost" id="previewBtn">预览</button><button class="btn" id="confirmBtn" disabled>确认保存计划</button></div></div></div>
<script>
let stock={id:'stock-mobile',name:'工业富联',code:'601138.SS',shares:500,capPct:20,strategy:{maxWeight:20,minTradeUnit:100,minTradeUnitConfirmed:true},plans:[]},root={stocks:[stock]},prepared=null,previewResult=null,writes=0;
function envelope(){return {schemaVersion:DiscussionPlanWorkflow.SCHEMA_VERSION,operation:'create',symbol:prepared.symbol,...prepared.binding,targetPlan:null,plan:{action:'reduce',triggerPrice:null,triggerDirection:null,quantity:100,conditions:{technical:['日线结构确认破坏。'],fundamental:[],catalyst:[],allocation:[],market:[],other:[]},invalidationConditions:['日线结构重新修复并确认。'],allocationConstraint:{maxPositionPct:null,targetWeightRange:null},validUntil:null,nextReviewDate:'2026-09-15',note:'结构破坏确认后减仓 100 股。'},reason:'当前对话明确形成减仓计划。',risks:['完整条件仍需用户确认。'],unresolvedItems:[]}}
function openPrompt(){prepared=DiscussionPlanWorkflow.prepare(stock);document.getElementById('promptText').value=prepared.request;document.getElementById('copyFeedback').textContent='';document.getElementById('promptModal').classList.add('show')}
async function copyPrompt(){const field=document.getElementById('promptText'),result=await ClipboardUtils.copyTextWithFallback(prepared.request,{selectableElement:field,manualCopy:false});document.getElementById('copyFeedback').textContent=result.ok?'已复制，可以在当前 AI 对话中继续':'复制失败，请长按复制'}
function openImport(){if(!prepared)prepared=DiscussionPlanWorkflow.prepare(stock);document.getElementById('jsonText').value=JSON.stringify(envelope(),null,2);document.getElementById('message').textContent='粘贴后先预览。';document.getElementById('preview').innerHTML='';document.getElementById('confirmBtn').disabled=true;document.getElementById('importModal').classList.add('show')}
function preview(){previewResult=DiscussionPlanWorkflow.process(document.getElementById('jsonText').value,{stock,prepared});document.getElementById('message').textContent=previewResult.message;document.getElementById('preview').innerHTML=DiscussionPlanWorkflow.renderPreview(previewResult);document.getElementById('confirmBtn').disabled=!previewResult.confirmReady}
async function confirmPlan(){const result=await DiscussionPlanWorkflow.commit(previewResult,root,{saveCandidate:async candidate=>{writes++;return candidate},adoptCandidate:candidate=>{root=candidate;stock=candidate.stocks[0]}} ,{now:'2026-09-01T14:00:00Z'});document.getElementById('importModal').classList.remove('show');document.getElementById('status').textContent=`正式计划写入次数：${writes} · 当前计划：${result.status==='completed'?'已确认保存':'未保存'} · 持仓：${stock.shares}`}
document.getElementById('prepare').onclick=openPrompt;document.getElementById('discussionPrepare').onclick=openPrompt;document.getElementById('copy').onclick=copyPrompt;document.getElementById('closePrompt').onclick=()=>document.getElementById('promptModal').classList.remove('show');document.getElementById('import').onclick=openImport;document.getElementById('discussionImport').onclick=openImport;document.getElementById('closeImport').onclick=()=>document.getElementById('importModal').classList.remove('show');document.getElementById('previewBtn').onclick=preview;document.getElementById('confirmBtn').onclick=confirmPlan;
</script>
</body>
</html>
