<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan V2 移动验收</title>
<style>
:root{--paper:#f5f1e8;--ink:#1b1b1b;--ink2:#4a4a48;--ink3:#8a857a;--seal:#b83a2b;--teal:#2f5d6e;--gold:#9a6b24;--line:rgba(27,27,27,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:100%;max-width:720px;margin:auto;padding:18px 14px 40px;overflow-x:hidden}h1{font-size:22px;margin:0 0 6px}.sub,.card-note{font-size:13px;color:var(--ink3);line-height:1.55}.card{border:1px solid var(--line);background:rgba(255,255,255,.34);padding:15px 14px;margin:14px 0}.card-title{font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:9px}.trig-list{display:flex;flex-direction:column;gap:10px}.trig-row{min-width:0;padding:14px 13px;border:1px solid rgba(184,58,43,.2);border-left:4px solid var(--seal);background:rgba(184,58,43,.06)}.trig-row.sell{border-color:rgba(47,93,110,.2);border-left-color:var(--teal);background:rgba(47,93,110,.06)}.trig-name{font-size:17px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}.trig-dist{margin-top:5px;font-size:14px;font-weight:800;color:var(--seal)}.sell .trig-dist{color:var(--teal)}.trig-desc{margin-top:8px;font-size:15px;line-height:1.6;color:var(--ink2);overflow-wrap:anywhere}.chip{display:inline-flex;margin-left:6px;padding:3px 8px;border-radius:999px;font-size:12px;vertical-align:2px}.valid{color:var(--gold);background:rgba(154,107,36,.12)}.review{color:var(--seal);background:rgba(184,58,43,.1)}.done{color:var(--ink3);background:rgba(27,27,27,.07)}button{min-height:44px;margin-top:9px;padding:8px 12px;border:1px solid var(--ink);background:var(--ink);color:white;font:inherit;font-weight:800}.proof{padding:12px;border-left:3px solid var(--gold);background:rgba(154,107,36,.1);font-size:14px;line-height:1.55}@media(max-width:390px){.wrap{padding-inline:12px}.card{padding-inline:12px}.trig-row{padding-inline:12px}}
</style>
<script src="../../src/plan-v2.js"></script>
</head>
<body><main class="wrap"><h1>计划中心 · 移动验收</h1><div class="sub">价格触发只是一项程序事实，不代表完整计划条件已经满足。</div><section class="card"><div class="card-title">当前计划</div><div id="current" class="trig-list"></div></section><section class="card"><div class="card-title">历史计划</div><div id="history" class="trig-list"></div></section><div id="proof" class="proof"></div></main>
<script>
const rows=[
  PlanV2.createPlan({id:'active',action:'buy',triggerPrice:10,triggerDirection:'below',quantity:100,note:'有效加仓计划',conditions:{technical:['支撑确认']},allocationConstraint:{maxPositionPct:12,targetWeightRange:null},nextReviewDate:'2026-09-19'},{now:'2026-08-20T08:00:00Z',source:'manual'}),
  PlanV2.normalizePlan({id:'legacy',action:'sell',price:11.5,triggerOn:'above',shares:100,note:'历史计划待人工确认'}),
  PlanV2.reconfirmPlan(PlanV2.normalizePlan({id:'reviewed',action:'sell',price:12,triggerOn:'above',shares:100,note:'已复核减仓计划'}),{now:'2026-08-27T08:00:00Z',nextReviewDate:'2026-09-26'}),
  PlanV2.terminatePlan(PlanV2.createPlan({id:'done',action:'sell',triggerPrice:13,triggerDirection:'above',quantity:100,note:'已完成历史计划'},{now:'2026-06-01T08:00:00Z',source:'manual'}),'completed',{now:'2026-08-10T08:00:00Z'})
];
const status=plan=>plan.status==='completed'?{text:'已完成',cls:'done'}:(plan.validityStatus==='needs_review'?{text:'需复核',cls:'review'}:{text:'有效',cls:'valid'}),date=plan=>plan.lastReviewedAt?`最后复核 ${plan.lastReviewedAt.slice(0,10)}`:(plan.source==='migrated_legacy'?'历史计划，日期未知':'尚未复核'),kind=plan=>['sell','reduce'].includes(plan.action)?'减仓':'加仓';
const view=plan=>{const s=status(plan),price=PlanV2.evaluatePriceTrigger(plan,10.4),priceText=price.status==='triggered'?'价格已触发，其他条件待确认':(price.status==='near'?'接近计划价格':'尚未达到计划价格');return `<article class="trig-row ${['sell','reduce'].includes(plan.action)?'sell':''}" data-plan="${plan.id}"><div class="trig-name">${kind(plan)} · ${plan.triggerPrice??'价格待复核'}<span class="chip ${s.cls}">${s.text}</span></div><div class="trig-dist">${priceText}</div><div class="trig-desc">${plan.note}<div class="card-note">${date(plan)}${plan.nextReviewDate?` · 下次复核 ${plan.nextReviewDate}`:''}</div>${plan.validityStatus==='needs_review'?'<button type="button">确认继续有效</button>':''}</div></article>`};
document.getElementById('current').innerHTML=rows.filter(plan=>plan.status==='active').map(view).join('');document.getElementById('history').innerHTML=rows.filter(plan=>plan.status!=='active').map(view).join('');
const edited=PlanV2.applyAuthoritativeEdit(rows[0],{triggerPrice:9.9,note:'普通编辑后的备注'},{now:'2026-08-28T08:00:00Z'}),richKept=edited.conditions.technical[0].text==='支撑确认'&&edited.allocationConstraint.maxPositionPct===12&&edited.planVersion===rows[0].planVersion+1;document.getElementById('proof').textContent=richKept?'普通编辑验收：丰富字段、配置约束与版本均已保留。':'普通编辑验收失败';
</script></body></html>
